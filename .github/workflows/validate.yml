name: Validate Catalog

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Validate catalog
        run: python scripts/validate.py --catalog data/catalog.json --schema data/catalog.schema.json
      
      - name: Run tests
        run: |
          pip install pytest
          python -m pytest tests/ -v
