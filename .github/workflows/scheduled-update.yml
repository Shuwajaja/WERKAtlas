name: Scheduled catalog audit

on:
  schedule:
    # 02:00 UTC. Im Winter 03:00 Uhr Europe/Berlin, im Sommer 04:00 Uhr.
    # Der Radar um 08:00 Uhr Europe/Berlin ist ein separater Vorschlagsgeber
    # und schreibt hier nichts.
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Read-only catalog audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Validate catalog
        run: python scripts/validate.py --catalog data/catalog.json --schema data/catalog.schema.json

      - name: Audit catalog invariants when the gate is present
        run: |
          if [ -f scripts/audit_catalog.py ]; then
            python scripts/audit_catalog.py --catalog data/catalog.json --schema data/catalog.schema.json --taxonomy data/taxonomy.json --as-of "$(date -u +%F)"
          else
            echo "audit_catalog.py is not on this ref yet; validate.py already ran."
          fi
